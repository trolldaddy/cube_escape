<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔方新世界 - 整合終端 V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        :root { --top-peek: 72px; --bottom-peek: 185px; }
        body { font-family: 'Noto+Sans+TC', sans-serif; background-color: #020617; color: #e2e8f0; touch-action: manipulation; overflow-x: hidden; }
        body.google-sites-mode { padding: 8px !important; }
        body.google-sites-mode .drawer-panel { box-shadow: none; backdrop-filter: none; }
        body.bottom-drawer-open .map-stage { transform: translateY(-110px); }

        /* 地圖相關樣式 */
        #mapContainer { position: relative; width: min(96vw, 1120px); margin: 0 auto; background-color: #0f172a; border-radius: 1.5rem; border: 2px solid #1e293b; overflow: hidden; }
        #bgMapImage { display: block; width: 100%; height: auto; z-index: 5; }
        #interactionOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; }
        .room-zone { position: absolute; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .room-target { background-color: rgba(59, 130, 246, 0.2) !important; border: 2px solid #3b82f6 !important; }
        .room-bombed { background-color: rgba(239, 68, 68, 0.3) !important; border: 2px solid #ef4444 !important; animation: bomb-pulse 1s infinite; }
        .room-poison { background-color: rgba(34, 197, 94, 0.2) !important; border: 2px solid #22c55e !important; }
        @keyframes bomb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* HP 網格 */
        .hp-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 100%; height: 8px; }
        .hp-bar-segment { height: 100%; border-radius: 1px; background-color: #1e293b; }
        .hp-active { background-color: #22c55e; }
        .hp-danger { background-color: #ef4444; }
        .hp-will-lose { background-color: #f59e0b; opacity: 0.3; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.6; } }

        /* 道具格與兩行高按鈕 */
        .cell-item {
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 12px; border: 2px solid transparent;
            cursor: pointer; transition: all 0.2s; min-height: 70px; overflow: hidden;
        }
        .cell-on { background-color: #2563eb; color: #fff; border-color: #60a5fa; }
        .cell-off { background-color: #1e293b; color: #64748b; border-color: #0f172a; }

        .tall-btn {
            width: 32px; align-self: stretch; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2); font-weight: 900; font-size: 16px; transition: background 0.2s;
        }
        .tall-btn:active { background: rgba(255,255,255,0.2); }

        .item-label-container { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; }
        .cell-label { font-size: 11px; font-weight: 800; line-height: 1.2; }

        /* 數值標籤與位置標籤 */
        .gun-tag { font-size: 9px; background: #ef4444; color: white; padding: 1px 3px; border-radius: 4px; margin-left: 2px; font-weight: 900; }
        .room-badge { background: #0f172a; color: #3b82f6; padding: 2px 8px; border-radius: 6px; font-size: 14px; font-weight: 900; border: 1px solid #1e293b; }
        .occupant-tag { background-color: #ef4444; color: white; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; pointer-events: none; border: 1px solid white; z-index: 50; margin: 1px 0; }
        .occupant-shadow { background-color: #8b5cf6; border-color: #c084fc; }

        /* 置中道具格樣式 (右側六格) */
        .center-item { justify-content: center; text-align: center; flex-direction: column; padding: 8px; }
        .action-btn { background-color: #facc15; color: #000; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; margin-top: 4px; transition: all 0.2s; }
        .action-btn-used { background-color: #475569; color: #cbd5e1; }
        .player-card-active { ring: 2px solid #3b82f6; background-color: #0f172a !important; border-color: #3b82f6 !important; }

        /* 抽屜樣式 */
        .drawer-handle { position: absolute; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 9999px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; z-index: 80; cursor: pointer; }
        .drawer-panel { backdrop-filter: blur(6px); z-index: 60; }
        #leftHandle { writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; }

        /* 抽屜整體字級提升（+2 級） */
        .drawer-panel .text-\[9px\] { font-size: 11px !important; }
        .drawer-panel .text-\[10px\] { font-size: 12px !important; }
        .drawer-panel .text-\[11px\] { font-size: 13px !important; }
        .drawer-panel .text-xs { font-size: 0.95rem !important; }
        .drawer-panel .text-sm { font-size: 1.05rem !important; }
        .drawer-panel .text-base { font-size: 1.15rem !important; }
        .drawer-panel .text-lg { font-size: 1.3rem !important; }
        .drawer-panel .text-xl { font-size: 1.45rem !important; }
        .drawer-handle { font-size: 15px; }

        /* 地圖微調位置，避免底部抽屜遮擋 */
        .map-stage { transform: translateY(-48px); }
        @media (max-width: 640px) {
            :root { --top-peek: 82px; --bottom-peek: 170px; }
            .map-stage { transform: translateY(-32px); }
            body.bottom-drawer-open .map-stage { transform: translateY(-86px); }
        }

        /* 上方抽屜佈局：固定摘要列、表格滾動 */
        #topDrawerContent { display: flex; flex-direction: column; gap: 12px; }
        #summaryTableShell { display: flex; flex-direction: column; max-height: min(45vh, 420px); }
        #summaryScrollArea { flex: 1; overflow-y: auto; }
        .summary-footer-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; }
        #poisonSummary { display: inline-flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
        #roundSummaryText { display: inline-flex; align-items: center; gap: 6px; }

        /* 表格資訊強化：提升可讀性 */
        #summaryTableShell table { font-size: 15px !important; }
        #summaryTableShell thead tr,
        #summaryTableShell th { font-size: 13px !important; }
        #summaryTableShell td { font-size: 15px !important; }
        #summaryTableShell th,
        #summaryTableShell td { padding-top: 12px !important; padding-bottom: 12px !important; }
        #resultContent table { font-size: 14px !important; }
        #resultContent thead tr { font-size: 12px !important; }
        #resultContent td { font-size: 14px !important; }

        /* 下方抽屜按鈕字級強化 */
        #bottomDrawer button:not(.tall-btn) { font-size: 1.12rem !important; }
        #bottomDrawer .tall-btn { font-size: 16px; }
    </style>
</head>
<body class="p-3 lg:p-6 min-h-screen relative overflow-hidden">
    <!-- 左側抽屜：通用控制 -->
    <div id="leftDrawer" data-state="closed" class="drawer-panel fixed left-4 top-1/2 w-80 max-w-[90vw] bg-slate-900/95 border border-slate-800 rounded-2xl shadow-2xl transition-all duration-300" style="transform: translate(-92%, -50%);">
        <button id="leftHandle" class="drawer-handle -right-10 top-1/2 -translate-y-1/2 px-2 py-3" onclick="toggleDrawer('left')">控制面板</button>
        <div class="p-4 space-y-4">
            <div class="flex items-center justify-between cursor-pointer" onclick="toggleDrawer('left')">
                <h2 class="text-lg font-black text-white">控制面板</h2>
                <select id="gameRound" onchange="renderAll()" class="bg-slate-900 text-amber-500 font-black text-xs px-3 py-2 rounded-xl border border-slate-800 outline-none">
                    <option value="0">回合 0 (落地戰)</option>
                    <option value="1">回合 1 (毒-1)</option><option value="2">回合 2 (毒-2)</option>
                    <option value="3">回合 3 (毒-2)</option><option value="4">回合 4 (毒-3)</option>
                    <option value="5">回合 5 (毒-3)</option><option value="6">回合 6 (毒-4)</option>
                </select>
            </div>
            <div class="flex gap-2">
                <input type="text" id="playerNameInput" placeholder="輸入玩家名稱..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 w-full font-bold outline-none" onkeypress="if(event.key==='Enter') addPlayer()">
                <button onclick="addPlayer()" class="bg-blue-600 w-14 rounded-xl font-black text-white text-xl">＋</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <select id="initialRoomInput" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 font-bold text-sm">
                    <option value="">初始地點</option>
                    <option value="103">103</option>
                    <option value="B103">B103</option>
                    <option value="B303">B303</option>
                    <option value="B307">B307</option>
                    <option value="B402">B402</option>
                    <option value="B603">B603</option>
                </select>
                <button onclick="startLandingRound()" class="bg-amber-600 py-2 rounded-xl font-black text-white text-xs">落地戰結算</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <input id="initialStrInput" type="number" min="0" value="4" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 font-bold text-sm" placeholder="武力">
                <input id="initialSpdInput" type="number" min="0" value="3" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 font-bold text-sm" placeholder="速度">
                <input id="initialLodInput" type="number" min="0" value="3" class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 font-bold text-sm" placeholder="負重">
            </div>
            <div class="space-y-2">
                <label class="text-[10px] uppercase tracking-widest text-slate-500 font-black">控制室解除毒氣房間</label>
                <div class="flex gap-2">
                    <select id="clearRoomSelect" onchange="updateClearedRoom(this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 font-bold text-sm">
                        <option value="">-- 無 --</option>
                    </select>
                    <button onclick="applyClearedRoom()" class="px-3 py-2 bg-amber-500 text-black font-black rounded-xl text-xs">解除</button>
                </div>
                <div id="clearRoomHelper" class="text-[10px] text-slate-500">選擇房間後按解除</div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="processTurn()" class="bg-emerald-600 py-3 rounded-xl font-black text-white text-sm uppercase">回合結算</button>
                <button onclick="resetData()" class="bg-slate-800 py-3 rounded-xl text-slate-400 font-bold text-xs">清空數據</button>
            </div>
            <div class="space-y-2 pt-1">
                <label class="text-[10px] uppercase tracking-widest text-slate-500 font-black">Google Sites 備份</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportState()" class="bg-indigo-600 py-2 rounded-xl font-black text-white text-xs">匯出 JSON</button>
                    <button onclick="triggerImport()" class="bg-indigo-900 py-2 rounded-xl font-black text-indigo-100 text-xs">匯入 JSON</button>
                </div>
                <input id="importStateInput" type="file" accept="application/json" class="hidden" onchange="importStateFromFile(event)">
                <div id="backupHint" class="text-[10px] text-slate-500">可選保險：重要節點手動匯出 JSON。</div>
            </div>
        </div>
    </div>

    <!-- 上方抽屜：全員統計 -->
    <div id="topDrawer" data-state="closed" class="drawer-panel fixed left-1/2 -translate-x-1/2 top-3 w-[96vw] max-w-[1400px] bg-slate-900/95 border border-slate-800 rounded-2xl shadow-2xl transition-all duration-300" style="transform: translate(-50%, calc(-100% + var(--top-peek)));">
        <button id="topHandle" class="drawer-handle left-1/2 -translate-x-1/2 bottom-[-14px] px-4 py-1" onclick="toggleDrawer('top')">玩家表</button>
        <div class="p-4" id="topDrawerContent">
            <div class="flex justify-end">
                <div id="mapStatusTip" class="bg-red-600/20 text-red-500 text-[10px] font-black px-3 py-1 rounded-xl text-center uppercase tracking-widest hidden border border-red-600/30">⚠️ 請在地圖上點選房間 ⚠️</div>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2 cursor-pointer" onclick="toggleDrawer('top')">
                <div class="flex items-center gap-2">
                    <span class="font-black text-[10px] tracking-widest uppercase">檢視回合</span>
                    <select id="viewRoundSelect" onchange="changeViewRound(this.value)" class="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs font-bold">
                        <option value="current">當前狀態</option>
                    </select>
                </div>
            </div>
            <div id="summaryTableShell" class="bg-slate-900/60 rounded-2xl border border-slate-800 overflow-hidden">
                <div id="summaryScrollArea">
                    <table class="w-full text-left text-[11px] table-fixed">
                        <thead class="bg-slate-800/50 text-slate-500 font-black uppercase">
                            <tr class="text-[10px]">
                                <th class="p-3">受試者</th><th class="p-3">位置</th><th class="p-3">力/速/負</th><th class="p-3 text-right">HP</th><th class="p-3 text-right">手術</th><th class="p-3 text-right">戰亂暗影</th><th class="p-3 text-right">毒氣</th><th class="p-3 text-right">飢餓</th><th class="p-3 text-right">火箭</th><th class="p-3 text-right">消耗品</th><th class="p-3 text-right">新HP</th>
                            </tr>
                        </thead>
                        <tbody id="summaryTableBody" class="divide-y divide-slate-800/50"></tbody>
                    </table>
                </div>
                <div class="p-3 bg-slate-900/80 border-t border-slate-800">
                    <div class="summary-footer-row">
                        <div id="roundSummaryText"></div>
                        <div id="poisonSummary"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部抽屜：當前玩家詳細 -->
    <div id="bottomDrawer" data-state="closed" class="drawer-panel fixed left-1/2 -translate-x-1/2 bottom-4 w-[98vw] max-w-[1400px] max-h-[58vh] bg-slate-900/95 border border-slate-800 rounded-3xl shadow-2xl transition-all duration-300" style="transform: translate(-50%, calc(100% - var(--bottom-peek)));">
        <button id="bottomHandle" class="drawer-handle left-1/2 -translate-x-1/2 -top-10 px-4 py-2" onclick="toggleDrawer('bottom')">玩家詳情</button>
        <div id="activePlayerContent" class="p-5 max-h-[calc(58vh-16px)] overflow-y-auto" onclick="event.stopPropagation()"></div>
    </div>

    <div id="topCollapsedSummary" class="fixed left-1/2 -translate-x-1/2 top-1 z-40 pointer-events-none hidden"></div>

    <!-- 右側抽屜：快捷玩家列 -->
    <div id="rightDrawer" data-state="closed" class="drawer-panel fixed right-3 top-1/2 w-48 max-w-[70vw] bg-slate-900/95 border border-slate-800 rounded-2xl shadow-2xl transition-all duration-300" style="transform: translate(88%, -50%);">
        <button id="rightHandle" class="drawer-handle -left-10 top-1/2 -translate-y-1/2 px-2 py-3" onclick="toggleDrawer('right')">
            <span class="flex flex-col leading-none gap-1 text-xs"><span>玩</span><span>家</span><span>快</span><span>捷</span></span>
        </button>
        <div id="quickPlayerRail" class="p-2 max-h-[72vh] overflow-y-auto space-y-2"></div>
    </div>

    <!-- 置中地圖 -->
    <div class="relative flex items-center justify-center min-h-screen z-0 map-stage">
        <div class="bg-slate-900/40 rounded-[2rem] border border-slate-800/50 p-4 flex items-center justify-center min-h-[500px] max-w-[90vw]">
            <div id="mapContainer">
                <img id="bgMapImage" src="https://raw.githubusercontent.com/trolldaddy/cube_escape/b03b1311f1a19acb5841f42579a0e78f2033ce48/p650925325.jpg" alt="地圖" onload="renderZones()">
                <div id="interactionOverlay"></div>
            </div>
        </div>
    </div>

    <!-- 結算彈窗 -->
    <div id="resultModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 rounded-[2rem] max-w-3xl w-full p-6 space-y-4">
            <h3 class="text-xl font-black text-white">回合結算報告</h3>
            <div id="resultContent" class="space-y-2 text-sm text-slate-400"></div>
            <div class="flex justify-end gap-2 pt-4">
                <button onclick="document.getElementById('resultModal').classList.add('hidden')" class="px-4 py-2 text-slate-500 font-bold">取消</button>
                <button onclick="confirmSettle()" class="px-6 py-2 bg-blue-600 rounded-xl font-black text-white">確認更新</button>
            </div>
        </div>
    </div>

        const landingRoomIds = new Set(['103', 'B103', 'B303', 'B307', 'B402', 'B603']);

        window.onload = () => {
            if (EMBEDDED_ON_GOOGLE_SITES) {
                document.body.classList.add('google-sites-mode');
            }

            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        players = parsed;
                    } else {
                        players = parsed.players || [];
                        const legacyClear = parsed.clearedRoomId || '';

                        lockedPoisonFloors = new Set(parsed.lockedPoisonFloors || parsed.poisonFloors || []);
                        settlementInputs = parsed.settlementInputs || {};
                        settlementHistory = parsed.settlementHistory || [];
                        viewRound = parsed.viewRound || 'current';
                    }
                } catch (e) {
                    players = [];
                }
            }
            if (players.length > 0) selectedUid = players[0].uid;
            initializeDrawers();
            renderAll();
        };
        function serializeState() {
            return {
                version: 1,
                exportedAt: new Date().toISOString(),
                players,
                clearedRooms: Array.from(clearedRooms),
                lockedPoisonFloors: Array.from(lockedPoisonFloors),
                settlementInputs,
                settlementHistory,
                viewRound
            };
        }

        function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState())); }

        function applyImportedState(parsed) {
            players = Array.isArray(parsed.players) ? parsed.players : [];
            clearedRooms = new Set(parsed.clearedRooms || []);
            lockedPoisonFloors = new Set(parsed.lockedPoisonFloors || parsed.poisonFloors || []);
            settlementInputs = parsed.settlementInputs || {};
            settlementHistory = parsed.settlementHistory || [];
            viewRound = parsed.viewRound || 'current';
            selectedUid = players[0]?.uid || null;
            save();
            renderAll();
        }

        function exportState() {
            const blob = new Blob([JSON.stringify(serializeState(), null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            link.href = URL.createObjectURL(blob);
            link.download = `cube_escape_backup_${stamp}.json`;
            document.body.appendChild(link);
            link.click();
            URL.revokeObjectURL(link.href);
            link.remove();
        }

        function triggerImport() {
            const input = document.getElementById('importStateInput');
            if (!input) return;
            input.value = '';
            input.click();
        }

        function importStateFromFile(evt) {
            const file = evt?.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (Array.isArray(parsed)) {
                        applyImportedState({ players: parsed });
                    } else {
                        applyImportedState(parsed || {});
                    }
                    alert('已完成匯入。');
                } catch (error) {
                    alert('匯入失敗：JSON 格式不正確。');
                }
            };
            reader.readAsText(file, 'utf-8');
        }

        function toggleDrawer(which, targetState) {
            const el = which === 'top'
                ? document.getElementById('topDrawer')
                : which === 'left'
                    ? document.getElementById('leftDrawer')
                    : which === 'right'
                        ? document.getElementById('rightDrawer')
                        : document.getElementById('bottomDrawer');
            const transforms = {
                top: { open: 'translate(-50%, 0)', closed: 'translate(-50%, calc(-100% + var(--top-peek)))' },
                left: { open: 'translate(0, -50%)', closed: 'translate(-92%, -50%)' },
                right: { open: 'translate(0, -50%)', closed: 'translate(88%, -50%)' },
                bottom: { open: 'translate(-50%, 0)', closed: 'translate(-50%, calc(100% - var(--bottom-peek)))' }
            };
            const desired = targetState || (el.dataset.state === 'open' ? 'closed' : 'open');
            el.style.transform = transforms[which][desired];
            el.dataset.state = desired;
            if (which === 'bottom') {
                document.body.classList.toggle('bottom-drawer-open', desired === 'open');
            }
            renderPoisonState();
        }

        function initializeDrawers() {
            toggleDrawer('top', 'closed');
            toggleDrawer('left', 'closed');
            toggleDrawer('right', 'closed');
            toggleDrawer('bottom', 'closed');
        }

        function ensureSettlementInputs() {
            players.forEach(p => {
                if (!settlementInputs[p.uid]) {
                    settlementInputs[p.uid] = { hunger: 0, consumable: 'none' };
                }
            });
        }

        function changeViewRound(val) {
            viewRound = val || 'current';
            renderAll();
            save();
        }

        function getRoomFloor(roomId) {
            if (!roomId) return '';
            const upper = roomId.toUpperCase();
            if (upper.startsWith('B')) return upper.slice(0, 2);
            return `${upper[0]}F`;
        }

        function getWinningPoisonFloors() {
            const counts = {};
            players.forEach(p => {
                if (p.isShadow || p.hp <= 0) return;
                const floor = (p.poisonFloor || '').toUpperCase();
                if (!floor || lockedPoisonFloors.has(floor)) return;
                const weight = p.tenVote ? 10 : 1;
                counts[floor] = (counts[floor] || 0) + weight;
            });
            const entries = Object.entries(counts);
            if (entries.length === 0) return new Set();
            const maxVote = Math.max(...entries.map(([, c]) => c));
            if (maxVote <= 0) return new Set();
            return new Set(entries.filter(([, c]) => c === maxVote).map(([f]) => f));
        }

        function getActivePoisonFloors(includePending = false) {
            const active = new Set(lockedPoisonFloors);
            if (includePending) {
                getWinningPoisonFloors().forEach(f => active.add(f));
            }
            return active;
        }

        function buildRocketHitMap() {
            const map = {};
            players.forEach(shooter => {
                if (shooter.items?.rocketLauncher && shooter.rocketTarget) {
                    const key = shooter.rocketTarget.toUpperCase();
                    map[key] = (map[key] || 0) + 4;
                }
            });
            return map;
        }

        function getConsumableDelta(code) {
            if (code === 'pill') return 2;
            return 0;
        }

        function getRationExemptReason(row) {
            const reasons = [];
            if (row.isShadow) reasons.push('暗影');
            if ((row.currentRoomId || '').toUpperCase() === 'B204' && row.hp > 0) reasons.push('餐廳');
            if (row.reviveBuffActive) reasons.push('復活保護');
            return reasons.join('/');
        }

        function buildSettlementRows(sourcePlayers = players) {
            ensureSettlementInputs();
            const round = parseInt(document.getElementById('gameRound').value);
            const isLandingRound = round === 0;
            const gasDmgList = [0, 1, 2, 2, 3, 3, 4];
            const gasDmg = gasDmgList[round];
            const activePoisonFloors = isLandingRound ? new Set() : getActivePoisonFloors(true);
            const rocketMap = buildRocketHitMap();

            // 預先計算戰鬥需要的力量與槍枝狀態
            const enriched = sourcePlayers.map(p => {
                const weaponStrBonus = (p.weapons?.shotgun * 4 || 0) + (p.weapons?.pistol * 2 || 0) + (p.weapons?.knife * 2 || 0);
                const totalStr = p.str + weaponStrBonus;
                const hasGun = (p.weapons?.shotgun > 0) || (p.weapons?.pistol > 0);
                const weightUsed = ((p.items?.mask?1:0) + (p.items?.rope?1:0) + (p.items?.adrenaline?1:0) + (p.items?.recycler?1:0) + (p.items?.rocketLauncher?1:0)) + ((p.weapons?.shotgun||0) + (p.weapons?.pistol||0) + (p.weapons?.knife||0));
                const finalSpdText = p.items?.adrenaline ? `${p.spd} (10)` : p.spd;
                return { ...p, totalStr, hasGun, weightUsed, finalSpdText, overweight: !p.items?.dimensionPocket && weightUsed > p.lod };
            });

            const roomMap = {};
            enriched.forEach(p => {
                if (!p.currentRoomId) return;
                const key = p.currentRoomId.toUpperCase();
                (roomMap[key] = roomMap[key] || []).push(p);
            });

            // 手術：正巧兩位存活玩家在手術室 -> 各 +4（上限 10）
            const surgeryBonus = {};
            const surgeryGroup = (roomMap['B202'] || []).filter(p => p.hp > 0 && !p.isShadow);
            if (surgeryGroup.length === 2) {
                surgeryGroup.forEach(p => surgeryBonus[p.uid] = 4);
            }

            // 戰鬥 / 亂鬥 / 暗影邏輯
            const battleDelta = {};
            const shadowGain = {};
            const battleLabel = {};
            const pushLabel = (uid, label) => {
                const parts = new Set((battleLabel[uid] || '').split(' ').filter(Boolean));
                parts.add(label);
                battleLabel[uid] = Array.from(parts).join(' ');
            };
            const resolveCombat = (group, room) => {
                if (group.length < 2) return;
                const guns = group.filter(p => p.hasGun);
                const roomDmg = {};

                if (guns.length === 1) {
                    const shooter = guns[0];
                    group.forEach(p => { if (p.uid !== shooter.uid) roomDmg[p.uid] = -(shooter.totalStr); });
                } else if (guns.length > 1) {
                    const maxGunStr = Math.max(...guns.map(p => p.totalStr));
                    guns.forEach(p => { if (p.totalStr < maxGunStr) roomDmg[p.uid] = -(maxGunStr - p.totalStr); });
                    group.filter(p => !p.hasGun).forEach(p => roomDmg[p.uid] = -(maxGunStr));
                } else {
                    const maxStr = Math.max(...group.map(p => p.totalStr));
                    group.forEach(p => { if (p.totalStr < maxStr) roomDmg[p.uid] = -(maxStr - p.totalStr); });
                }

                Object.entries(roomDmg).forEach(([uid, delta]) => {
                    battleDelta[uid] = (battleDelta[uid] || 0) + delta;
                    pushLabel(uid, group.length >= 3 ? '亂鬥' : '戰鬥');
                });
            };

            Object.entries(roomMap).forEach(([room, group]) => {
                if (isLandingRound && !landingRoomIds.has(room)) return;
                const livingGroup = group.filter(p => p.hp > 0 && !p.isShadow);
                const shadows = group.filter(p => p.isShadow);
                if (room === 'B202') {
                    if (livingGroup.length >= 3) resolveCombat(livingGroup, room);
                } else {
                    resolveCombat(livingGroup, room);
                }

                if (shadows.length > 0 && livingGroup.length > 0) {
                    livingGroup.forEach(p => {
                        battleDelta[p.uid] = (battleDelta[p.uid] || 0) - 1;
                        pushLabel(p.uid, '暗影');
                    });
                    shadows.forEach(s => {
                        shadowGain[s.uid] = (shadowGain[s.uid] || 0) + livingGroup.length;
                    });
                }
            });

            return enriched.map(p => {
                const upperRoom = p.currentRoomId?.toUpperCase() || '';
                const maskOn = p.items?.mask;
                const shadow = p.isShadow;
                const gasOn = upperRoom ? isRoomPoisoned(upperRoom, activePoisonFloors) : false;
                const reviveBuffActive = p.reviveBuffRound === round;
                const poisonImmune = reviveBuffActive;
                const rationExempt = (p.hp > 0 && upperRoom === 'B204') || shadow || reviveBuffActive;
                const poisonDelta = (!maskOn && gasOn && !shadow && !poisonImmune) ? -gasDmg : 0;
                const rocketDelta = upperRoom ? -(rocketMap[upperRoom] || 0) : 0;
                const surgeryDelta = Number(surgeryBonus[p.uid] || 0);
                const combatDelta = Number(battleDelta[p.uid] || 0);
                const combatLabel = battleLabel[p.uid] || '';
                const hunger = rationExempt ? 0 : Number(settlementInputs[p.uid]?.hunger ?? 0);
                const consumable = isLandingRound ? 'none' : (settlementInputs[p.uid]?.consumable || 'none');
                const consumableDelta = Number(getConsumableDelta(consumable));
                const shadowDrainGain = Number(shadowGain[p.uid] || 0);
                const shadowDrainTotal = Number(p.shadowDrainTotal || 0) + shadowDrainGain;

                const clampHp = (val) => Math.max(0, Math.min(10, val));
                let runningHp = clampHp(p.hp + surgeryDelta);
                runningHp = clampHp(runningHp + combatDelta);
                runningHp = clampHp(runningHp + poisonDelta);
                runningHp = clampHp(runningHp + hunger);
                runningHp = clampHp(runningHp + rocketDelta);
                runningHp = clampHp(runningHp + consumableDelta);

                const newHp = runningHp;

                return {
                    ...p,
                    gasStatus: gasOn,
                    baseHp: p.hp,
                    surgeryDelta,
                    battleDelta: combatDelta,
                    battleLabel: combatLabel,
                    poisonDelta,
                    hungerDelta: hunger,
                    rocketDelta,
                    consumable,
                    consumableDelta,
                    poisonImmune,
                    rationExempt,
                    reviveBuffActive,
                    shadowDrainGain,
                    shadowDrainTotal,
                    newHp,
                };
            });
        }

        function isRoomPoisoned(roomId, activeFloors) {
            if (!roomId) return false;
            const upper = roomId.toUpperCase();
            if (clearedRooms.has(upper)) return false;
            if (upper === '202') return false;
            if (upper === 'B501') return activeFloors.has('B4') && activeFloors.has('B5');
            const floor = getRoomFloor(upper);
            return activeFloors.has(floor);
        }

        function getCalculatedState() {
            const round = parseInt(document.getElementById('gameRound').value);
            const gasDmgList = [0, 1, 2, 2, 3, 3, 4];
            const gasDmg = gasDmgList[round];
            const activePoisonFloors = getActivePoisonFloors(true);

            return players.map(p => {
                let dmg = 0; let weightUsed = 0;
                let weaponStrBonus = (p.weapons.shotgun * 4) + (p.weapons.pistol * 2) + (p.weapons.knife * 2);

                weightUsed += (p.items.mask?1:0) + (p.items.rope?1:0) + (p.items.adrenaline?1:0) + (p.items.recycler?1:0) + (p.items.rocketLauncher?1:0);
                weightUsed += (p.weapons.shotgun || 0) + (p.weapons.pistol || 0) + (p.weapons.knife || 0);

                let gasStatus = false;
                if (p.currentRoomId) {
                    gasStatus = isRoomPoisoned(p.currentRoomId, activePoisonFloors);
                }

                if (!p.items.mask && gasStatus && !p.isShadow) dmg += gasDmg;
                players.forEach(other => { if (other.items.rocketLauncher && other.rocketTarget && p.currentRoomId?.toUpperCase() === other.rocketTarget.toUpperCase()) dmg += 4; });

                const finalSpdText = p.items.adrenaline ? `${p.spd} (10)` : p.spd;
                const totalStr = p.str + weaponStrBonus;
                const hasGun = (p.weapons.shotgun > 0) || (p.weapons.pistol > 0);

                return { ...p, gasStatus, totalStr, expectedDmg: dmg, newHp: Math.max(0, p.hp - dmg), finalSpdText, weightUsed, overweight: !p.items.dimensionPocket && weightUsed > p.lod, hasGun };
            });
        }

        function addPlayer() {

            players.push({ uid: Date.now(), name, hp: 10, currentRoomId: initialRoom, gasStatus: false, poisonFloor: '', tenVote: false, isShadow: false, everShadow: false, shadowDrainTotal: 0, reviveBuffRound: null, str: initialStr, spd: initialSpd, lod: initialLod, rocketTarget: '', recyclerUsed: false, weapons: { shotgun: 0, pistol: 0, knife: 0 }, items: { mask: false, rope: false, adrenaline: false, recycler: false, rocketLauncher: false, dimensionPocket: false } });
            document.getElementById('playerNameInput').value = '';
            document.getElementById('initialRoomInput').value = '';
            settlementInputs[players[players.length - 1].uid] = { hunger: 0, consumable: 'none' };
            selectedUid = players[players.length - 1].uid;
            renderAll();
            save();
        }

        function buildSettlementAnnouncements(rows, hungerOptions, round) {
            const roomMap = {};
            rows.forEach(r => {
                const room = (r.currentRoomId || '').toUpperCase();
                if (!room) return;
                (roomMap[room] = roomMap[room] || []).push(r);
            });

            const surgeryGroup = (roomMap['B202'] || []).filter(r => r.hp > 0 && !r.isShadow);
            const surgeryText = surgeryGroup.length === 2
                ? `手術室發生手術：${surgeryGroup.map(r => r.name).join('、')} 各 +4`
                : '手術室未發生手術';

            const conflictRooms = [];
            Object.entries(roomMap).forEach(([room, group]) => {
                const living = group.filter(g => g.hp > 0 && !g.isShadow);
                const shadows = group.filter(g => g.isShadow);
                const flags = [];
                if (room === 'B202') {
                    if (living.length >= 3) flags.push('亂鬥');
                } else if (living.length >= 3) {
                    flags.push('亂鬥');
                } else if (living.length === 2) {
                    flags.push('戰鬥');
                }
                if (living.length > 0 && shadows.length > 0) flags.push('暗影相遇');
                if (flags.length > 0) conflictRooms.push(`${room}(${flags.join('、')})`);
            });
            const conflictDeaths = rows.filter(r => r.battleDelta < 0 && r.newHp <= 0).map(r => r.name);
            const shadowDrainLines = rows
                .filter(r => r.shadowDrainGain > 0)
                .map(r => `${r.name}+${r.shadowDrainGain}（累積${r.shadowDrainTotal}）`);
            const conflictText = conflictRooms.length
                ? `事件房間：${conflictRooms.join('、')}｜死亡：${conflictDeaths.length ? conflictDeaths.join('、') : '無'}${shadowDrainLines.length ? `｜暗影吸收：${shadowDrainLines.join('、')}` : ''}`
                : '本回合無戰鬥/亂鬥/暗影事件';

            const winningFloors = round === 0 ? [] : Array.from(getWinningPoisonFloors()).sort();
            const existingPoisonFloors = round === 0 ? [] : Array.from(lockedPoisonFloors).sort();
            const newPoisonFloors = winningFloors.filter(f => !lockedPoisonFloors.has(f));
            const poisonFloors = round === 0 ? [] : Array.from(new Set([...existingPoisonFloors, ...winningFloors])).sort();
            const poisonDeaths = rows.filter(r => r.poisonDelta < 0 && r.newHp <= 0).map(r => r.name);
            const poisonText = poisonFloors.length
                ? `毒氣樓層：既有[${existingPoisonFloors.length ? existingPoisonFloors.join('、') : '無'}]＋新增[${newPoisonFloors.length ? newPoisonFloors.join('、') : '無'}]＝最終[${poisonFloors.join('、')}]｜死亡：${poisonDeaths.length ? poisonDeaths.join('、') : '無'}`
                : '目前無毒氣樓層';

            const hungerCells = rows.map(r => `
                <div class="border border-slate-700 rounded-lg p-2 bg-slate-900/60">
                    <div class="text-xs text-slate-300 font-black mb-1 text-center">${r.name}</div>
                    <div class="text-center">
                        ${r.rationExempt ? `<span class="text-emerald-300 font-black">免繳（${getRationExemptReason(r) || '規則'}）</span>` : `
                        <select class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm" onchange="updateHunger(${r.uid}, this.value)">
                            ${hungerOptions.map(h => `<option value="${h}" ${r.hungerDelta === h ? 'selected' : ''}>${h}</option>`).join('')}
                        </select>`}
                    </div>
                </div>
            `).join('');

            const rocketLaunches = players
                .filter(p => p.items?.rocketLauncher && p.rocketTarget)
                .map(p => ({ shooter: p.name, target: p.rocketTarget.toUpperCase() }));
            const launchedRooms = [...new Set(rocketLaunches.map(r => r.target))];
            const impactedRows = rows.filter(r => launchedRooms.includes((r.currentRoomId || '').toUpperCase()));
            const rocketDeaths = impactedRows.filter(r => r.newHp <= 0).map(r => r.name);
            const rocketText = launchedRooms.length
                ? `火箭筒襲擊：${rocketLaunches.map(r => `${r.shooter}→${r.target}`).join('、')}｜受襲房間：${launchedRooms.join('、')}｜受襲玩家：${impactedRows.length ? impactedRows.map(r => r.name).join('、') : '無'}｜死亡：${rocketDeaths.length ? rocketDeaths.join('、') : '無'}`
                : '本回合無火箭筒襲擊';

            const revivedShadows = rows.filter(r => r.isShadow && (r.everShadow || r.isShadow) && r.shadowDrainTotal >= 2).map(r => `${r.name}(${r.shadowDrainTotal})`);
            const reviveText = revivedShadows.length ? `復活暗影玩家：${revivedShadows.join('、')}（下回合免疫毒氣且免繳水糧）` : '本回合無可復活暗影玩家';

            return `
                <div class="mt-4 space-y-2 text-sm text-slate-200">
                    <div class="font-black text-amber-300">結算宣布順序</div>
                    <div>1. ${surgeryText}</div>
                    <div>2. ${conflictText}</div>
                    <div>3. ${poisonText}</div>
                    <div class="pt-1">4. 繳交水糧</div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-2">
                        ${hungerCells}
                    </div>
                    <div>5. ${rocketText}</div>
                    <div>6. ${reviveText}</div>
                </div>
            `;
        }

        function processTurn() {
            ensureSettlementInputs();
            renderSettlementModal();
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function confirmSettle() {
            const round = parseInt(document.getElementById('gameRound').value);
            const rows = buildSettlementRows();
            if (round > 0) {
                const winners = getWinningPoisonFloors();
                lockedPoisonFloors = new Set([...lockedPoisonFloors, ...winners]);
            }

            settlementHistory = settlementHistory.filter(entry => entry.round !== round);
            settlementHistory.push({ round, rows: rows.map(r => ({...r})) });

            players = rows.map(p => {
                const becameShadow = p.newHp <= 0;
                const nextShadow = p.isShadow || becameShadow;
                const nextDrainTotal = p.shadowDrainTotal || 0;
                const revivedFromShadow = nextShadow && (p.everShadow || p.isShadow || becameShadow) && nextDrainTotal >= 2;
                const finalShadow = revivedFromShadow ? false : nextShadow;
                const finalHp = revivedFromShadow ? 1 : p.newHp;
                const nextReviveBuffRound = revivedFromShadow
                    ? round + 1
                    : (p.reviveBuffRound && p.reviveBuffRound > round ? p.reviveBuffRound : null);
                return {
                    ...p,
                    hp: finalHp,
                    isShadow: finalShadow,
                    everShadow: p.everShadow || p.isShadow || becameShadow,
                    shadowDrainTotal: finalShadow ? nextDrainTotal : 0,
                    reviveBuffRound: finalShadow ? null : nextReviveBuffRound,
                    currentRoomId: finalShadow ? 'B701' : p.currentRoomId,
                    poisonFloor: finalShadow ? '' : p.poisonFloor,
                    tenVote: finalShadow ? false : p.tenVote,
                    rocketTarget: '',
                    recyclerUsed: false,
                    items: { ...p.items, adrenaline: false }
                };
            });
            document.getElementById('resultModal').classList.add('hidden');

            const roundSel = document.getElementById('gameRound');
            if (roundSel && roundSel.selectedIndex < roundSel.options.length - 1) {
                roundSel.selectedIndex += 1;
            }
            viewRound = 'current';
            settlementInputs = {};
            renderAll();
            save();
        }

        function renderAll() { syncShadowStates(); renderSummary(); renderZones(); renderActivePlayer(); renderSelectOptions(); renderRoundViewer(); renderPoisonState(); renderQuickPlayerRail(); }

        function renderQuickPlayerRail() {
            const rail = document.getElementById('quickPlayerRail');
            if (!rail) return;
            rail.innerHTML = '';
            players.forEach(p => {
                const isActive = p.uid === selectedUid;
                const btn = document.createElement('button');
                btn.className = `w-full text-left rounded-xl border px-3 py-2 transition-all ${isActive ? 'bg-blue-600/90 border-blue-300 text-white' : 'bg-slate-900/90 border-slate-700 text-slate-200 hover:border-blue-500'}`;
                btn.innerHTML = `
                    <div class="text-[12px] font-black truncate">${p.name}</div>
                    <div class="text-[10px] opacity-80 mt-1">${p.currentRoomId || '未定位'}</div>
                    <div class="text-[11px] font-black mt-1 ${p.hp <= 3 ? 'text-red-300' : 'text-emerald-300'}">HP ${p.hp}</div>
                `;
                btn.onclick = () => {
                    selectedUid = p.uid;
                    isAimingMode = false;
                    isMoveMode = false;
                    focusSelectedPlayerOnMap();
                    renderAll();
                };
                rail.appendChild(btn);
            });
        }

        function syncShadowStates() {
            let mutated = false;
            players.forEach(p => {
                if (p.hp <= 0 && !p.isShadow) {
                    p.isShadow = true;
                    p.everShadow = true;
                    p.currentRoomId = 'B701';
                    p.poisonFloor = '';
                    p.tenVote = false;
                    p.shadowDrainTotal = p.shadowDrainTotal || 0;
                    p.reviveBuffRound = null;
                    mutated = true;
                }
            });
            if (mutated) save();
        }

        function renderRoundViewer() {
            const select = document.getElementById('viewRoundSelect');
            if (!select) return;
            const currentVal = select.value || viewRound;
            select.innerHTML = '<option value="current">當前狀態</option>';
            settlementHistory.sort((a,b) => a.round - b.round).forEach(entry => {
                const opt = document.createElement('option');
                opt.value = `${entry.round}`;
                opt.textContent = `回合 ${entry.round}`;
                if (opt.value === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderSelectOptions() {
            const clearSelect = document.getElementById('clearRoomSelect');
            const existing = clearSelect.value;
            clearSelect.innerHTML = '<option value="">-- 無 --</option>';
            const activeFloors = getActivePoisonFloors();
            mapConfig.forEach(r => {
                if (!isRoomPoisoned(r.id, activeFloors)) return;
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = `${r.id} ${r.name}`;
                if (r.id === existing) opt.selected = true;
                clearSelect.appendChild(opt);
            });
        }

        function updateClearedRoom(val) {
            const target = val || '';
            const indicator = document.getElementById('clearRoomHelper');
            if (indicator) indicator.textContent = target ? `準備解除：${target}` : '選擇房間後按解除';
        }

        function updateHunger(uid, val) {
            ensureSettlementInputs();
            settlementInputs[uid] = settlementInputs[uid] || { hunger: 0, consumable: 'none' };
            const parsed = parseInt(val, 10);
            settlementInputs[uid].hunger = Number.isNaN(parsed) ? 0 : parsed;
            renderSettlementModal();
            renderSummary();
            save();
        }

        function updateConsumable(uid, val) {
            ensureSettlementInputs();
            settlementInputs[uid] = settlementInputs[uid] || { hunger: 0, consumable: 'none' };
            settlementInputs[uid].consumable = val;
            renderSettlementModal();
            renderSummary();
            save();
        }

        function applyClearedRoom() {
            const sel = document.getElementById('clearRoomSelect');
            if (!sel.value) return;
            clearedRooms.add(sel.value.toUpperCase());
            renderAll();
            save();
        }

        function renderPoisonState() {
            const summary = document.getElementById('poisonSummary');
            const roundSummary = document.getElementById('roundSummaryText');
            const collapsed = document.getElementById('topCollapsedSummary');
            const topDrawer = document.getElementById('topDrawer');
            const locked = new Set(lockedPoisonFloors);
            const winners = getWinningPoisonFloors();
            const pending = Array.from(winners).filter(f => !locked.has(f));
            const chipDefs = [];

            const roundSel = document.getElementById('gameRound');
            const roundText = roundSel?.options[roundSel.selectedIndex]?.textContent || '';

            if (locked.size === 0) {
                chipDefs.push({ label: '目前無毒氣樓層', className: 'bg-slate-800 text-slate-400 border border-slate-700' });
            } else {
                Array.from(locked).sort().forEach(floor => {
                    chipDefs.push({ label: `${floor}（已鎖定）`, className: 'bg-emerald-500/20 text-emerald-200 border border-emerald-500/40' });
                });
            }

            if (pending.length > 0) {
                chipDefs.push({ label: '待結算', className: 'bg-blue-500/20 text-blue-100 border border-blue-500/40' });
                pending.sort().forEach(floor => {
                    chipDefs.push({ label: `${floor}（最高票）`, className: 'bg-blue-500/20 text-blue-100 border border-blue-500/40' });
                });
            }

            if (clearedRooms.size > 0) {
                chipDefs.push({ label: '已解除', className: 'bg-amber-500/20 text-amber-200 border border-amber-500/40' });
                Array.from(clearedRooms).sort().forEach(room => {
                    chipDefs.push({ label: room, className: 'bg-amber-500/20 text-amber-200 border border-amber-500/40' });
                });
            }

            const makeChipHtml = (label, color) => `<span class="px-2 py-1 rounded-lg text-[10px] font-black ${color}">${label}</span>`;
            const chipsHtml = chipDefs.map(def => makeChipHtml(def.label, def.className)).join('');

            if (roundSummary) {
                roundSummary.innerHTML = `<span class="text-[10px] text-slate-400 font-black uppercase tracking-widest">回合摘要</span>` +
                    `<span class="text-[11px] text-amber-300 font-bold">${roundText}</span>`;
            }

            if (summary) {
                summary.innerHTML = `<span class="text-[10px] text-slate-400 font-black uppercase tracking-widest">毒氣狀態</span>${chipsHtml}`;
            }

            if (collapsed) {
                const isClosed = (topDrawer?.dataset.state || 'open') === 'closed';
                collapsed.classList.toggle('hidden', !isClosed);
                if (isClosed) {
                    collapsed.innerHTML = `<div class="bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2 shadow-xl inline-flex items-center gap-2 pointer-events-auto whitespace-nowrap overflow-x-auto">` +
                        `<span class="text-xs font-black text-white">回合摘要</span>` +
                        `<span class="text-[11px] text-amber-300 font-bold">${roundText}</span>` +
                        chipsHtml +
                        `</div>`;
                } else {
                    collapsed.innerHTML = '';
                }
            }
        }

        function renderActivePlayer() {
            const container = document.getElementById('activePlayerContent');
            container.innerHTML = '';
            const data = getCalculatedState();
            const p = data.find(x => x.uid === selectedUid);
            if (!p) { container.innerHTML = '<div class="text-center text-slate-500">尚未選擇玩家</div>'; return; }

            let hpHtml = ''; for(let i=1; i<=10; i++) { hpHtml += `<div class="hp-bar-segment ${i <= p.newHp ? (p.newHp <= 3 ? 'hp-danger' : 'hp-active') : (i <= p.hp ? 'hp-will-lose' : '')}"></div>`; }

            const gridHtml = [
                { type: 'weapon', k: 'shotgun', l: '霰彈槍', e: '🔫' },
                { type: 'item', k: 'adrenaline', l: '腎上腺素', e: '💉' },
                { type: 'item', k: 'rocketLauncher', l: '火箭筒', e: '🚀', action: 'aim' },
                { type: 'weapon', k: 'pistol', l: '手槍', e: '🔫' },
                { type: 'item', k: 'rope', l: '繩索', e: '🪢' },
                { type: 'item', k: 'dimensionPocket', l: '次元口袋', e: '🌀' },
                { type: 'weapon', k: 'knife', l: '小刀', e: '🔪' },
                { type: 'item', k: 'mask', l: '防毒面具', e: '🎭' },
                { type: 'item', k: 'recycler', l: '循環回收', e: '♻️', action: 'use' }
            ].map((item) => {
                if (item.type === 'weapon') {
                    const count = p.weapons[item.k];
                    return `<div class="cell-item ${count > 0 ? 'cell-on' : 'cell-off'}">
                        <button onclick="changeWeapon(${p.uid}, '${item.k}', -1)" class="tall-btn">－</button>
                        <div class="item-label-container">
                            <span class="cell-label">${item.e}<br>${item.l}</span>
                            <span class="text-xs font-black mt-1">${count}</span>
                        </div>
                        <button onclick="changeWeapon(${p.uid}, '${item.k}', 1)" class="tall-btn">＋</button>
                    </div>`;
                } else {
                    const on = p.items[item.k];
                    let actionHtml = '';
                    if (on && item.action === 'aim') {
                        actionHtml = `<button onclick="enableAimMode(event)" class="action-btn">${p.rocketTarget || '瞄準'}</button>`;
                    } else if (on && item.action === 'use') {
                        actionHtml = `<button onclick="toggleRecyclerUse(event, ${p.uid})" class="action-btn ${p.recyclerUsed ? 'action-btn-used' : ''}">${p.recyclerUsed ? '已使用' : '使用'}</button>`;
                    }
                    return `<div onclick="toggleItem(event, ${p.uid}, '${item.k}')" class="cell-item center-item ${on ? 'cell-on' : 'cell-off'}">
                        <span class="cell-label">${item.e} ${item.l}</span>
                        <div class="text-[9px] opacity-60">${on ? '已持有' : '未持有'}</div>
                        ${actionHtml}
                    </div>`;
                }
            }).join('');

            const poisonFloorOptions = ['', '2F', '1F', 'B1', 'B2', 'B3', 'B4', 'B5', 'B6', 'B7'];
            const availableFloors = poisonFloorOptions.filter(f => !lockedPoisonFloors.has(f) || f === p.poisonFloor);
            const poisonSelect = p.isShadow ? `<span class="text-slate-500">暗影免投票</span>` : `
                <select class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs font-black"
                    onchange="updatePlayer(${p.uid}, 'poisonFloor', this.value)">
                    ${availableFloors.map(v => `<option value="${v}" ${(p.poisonFloor === v || (!p.poisonFloor && v === '')) ? 'selected' : ''} ${lockedPoisonFloors.has(v) && v === p.poisonFloor ? 'disabled' : ''}>${v ? (lockedPoisonFloors.has(v) ? v + '（已毒）' : v) : '未選擇'}</option>`).join('')}
                </select>`;

            container.innerHTML = `
                <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
                    <div class="flex items-center gap-3 flex-wrap">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-black text-white">${p.name}</span>
                            <span class="room-badge">${p.currentRoomId || '??'}</span>
                            <button class="px-3 py-2 text-xs font-black bg-blue-600 rounded-xl" onclick="enableMoveMode()">移動</button>
                            <button class="px-3 py-2 text-xs font-black rounded-xl ${p.isShadow ? 'bg-violet-600 text-white' : 'bg-slate-700 text-slate-100'}" onclick="toggleShadowState(${p.uid})">${p.isShadow ? '解除暗影' : '設為暗影'}</button>
                        </div>
                        <div class="flex items-center gap-3 text-xs font-black text-slate-300">
                            <label class="flex items-center gap-1">投毒樓層 ${poisonSelect}</label>
                            <label class="flex items-center gap-1"><input type="checkbox" ${p.tenVote ? 'checked' : ''} onchange="updatePlayer(${p.uid}, 'tenVote', this.checked)">10票</label>
                        </div>
                        <div class="w-full text-xs text-slate-500">負重: <span class="${p.overweight ? 'text-red-500 font-black' : ''}">${p.weightUsed}/${p.items.dimensionPocket ? '∞' : p.lod}</span></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-slate-800/60 border border-slate-700 rounded-xl overflow-hidden">
                            <button class="px-2 text-xs font-black" onclick="changeHp(${p.uid}, -1)">－</button>
                            <span class="px-3 text-2xl font-black ${p.hp <= 3 ? 'text-red-500' : 'text-green-500'}">${p.hp}</span>
                            <button class="px-2 text-xs font-black" onclick="changeHp(${p.uid}, 1)">＋</button>
                        </div>
                        <button class="text-[10px] px-2 py-1 rounded-lg bg-slate-800 border border-slate-700" onclick="toggleDrawer('bottom')">收合</button>
                    </div>
                </div>
                <div class="hp-grid mb-4">${hpHtml}</div>

                <div class="grid grid-cols-3 gap-2 mb-4">
                    ${[{k:'str',l:'武力',v:p.totalStr,tag:p.hasGun?'(持槍)':''},{k:'spd',l:'速度',v:p.finalSpdText},{k:'lod',l:'負重',v:p.lod}].map(a => `
                        <div class="bg-slate-950/40 rounded-xl overflow-hidden flex justify-between items-center border border-slate-800">
                            <button onclick="changeAttr(${p.uid},'${a.k}',-1)" class="tall-btn">－</button>
                            <div class="text-center py-1">
                                <div class="text-[9px] font-bold text-slate-500 leading-none">${a.l}${a.tag?`<br><span class='gun-tag'>${a.tag}</span>`:''}</div>
                                <div class="text-xs font-black text-white mt-1">${a.v}</div>
                            </div>
                            <button onclick="changeAttr(${p.uid},'${a.k}',1)" class="tall-btn">＋</button>
                        </div>`).join('')}
                </div>

                <div class="grid grid-cols-3 gap-2 mb-4">${gridHtml}</div>

                <div class="flex justify-end items-center text-[10px] font-bold text-slate-600">
                    <button onclick="removePlayer(${p.uid})" class="hover:text-red-500">移除玩家</button>
                </div>`;
        }

        function renderSummary() {
            const tbody = document.getElementById('summaryTableBody');
            let data;
            if (viewRound !== 'current') {
                const found = settlementHistory.find(e => `${e.round}` === `${viewRound}`);
                data = found ? found.rows : buildSettlementRows();
            } else {
                data = buildSettlementRows();
            }
            tbody.innerHTML = '';
            data.forEach(p => {
                const consumableLabel = p.consumable === 'pill' ? '藥片' : p.consumable === 'adrenaline' ? '腎上腺素' : '--';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-bold text-white">${p.name}</td>
                    <td class="p-3 text-slate-500">${p.currentRoomId || '--'}</td>
                    <td class="p-3 font-mono text-blue-500">${p.totalStr}/${p.finalSpdText}/${p.items.dimensionPocket ? '∞' : p.lod}</td>
                    <td class="p-3 text-right text-white">${p.baseHp}</td>
                    <td class="p-3 text-right ${p.surgeryDelta>0?'text-emerald-400':'text-slate-300'}">${p.surgeryDelta>=0?'+':''}${p.surgeryDelta}</td>
                    <td class="p-3 text-right text-slate-300">${p.battleDelta>=0?'+':''}${p.battleDelta}${p.battleLabel ? ' '+p.battleLabel : ''}</td>
                    <td class="p-3 text-right text-red-400">${p.poisonDelta}</td>
                    <td class="p-3 text-right text-amber-400">${p.rationExempt ? `免繳(${getRationExemptReason(p) || '規則'})` : p.hungerDelta}</td>
                    <td class="p-3 text-right text-red-400">${p.rocketDelta}</td>
                    <td class="p-3 text-right text-emerald-300">${consumableLabel} ${p.consumableDelta?`(${p.consumableDelta>=0?'+':''}${p.consumableDelta})`:''}</td>
                    <td class="p-3 text-right text-amber-500 font-black">${p.newHp}</td>`;
                if (viewRound === 'current') tr.onclick = () => selectPlayer(p.uid);
                tbody.appendChild(tr);
            });
        }

        function renderZones() {
            const overlay = document.getElementById('interactionOverlay'); overlay.innerHTML = '';
            const occupants = {};
            const bombedRooms = new Set();
            const activePoisonFloors = getActivePoisonFloors();
            players.forEach(p => {
                if(p.currentRoomId) (occupants[p.currentRoomId] = occupants[p.currentRoomId] || []).push({ name: p.name, isShadow: p.isShadow });
                if(p.items?.rocketLauncher && p.rocketTarget) bombedRooms.add(p.rocketTarget.toUpperCase());
            });
            document.getElementById('mapStatusTip').classList.toggle('hidden', !(isAimingMode || isMoveMode));
            mapConfig.forEach(conf => {
                const zone = document.createElement('div');
                const p = selectedUid ? players.find(x => x.uid === selectedUid) : null;
                const isCurrentLoc = p && p.currentRoomId === conf.id;
                const isBombed = bombedRooms.has(conf.id.toUpperCase());
                const poisoned = isRoomPoisoned(conf.id, activePoisonFloors);
                zone.className = `room-zone ${isCurrentLoc ? 'room-target' : ''} ${isBombed ? 'room-bombed' : ''} ${poisoned ? 'room-poison' : ''}`;
                zone.style.cssText = `left:${conf.x}%; top:${conf.y}%; width:${conf.w}%; height:${conf.h}%;`;
                if (occupants[conf.id]) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'flex flex-col items-center pointer-events-none';
                    occupants[conf.id].forEach(person => {
                        const tag = document.createElement('div');
                        tag.className = `occupant-tag ${person.isShadow ? 'occupant-shadow' : ''}`;
                        tag.innerText = person.name;
                        wrapper.appendChild(tag);
                    });
                    zone.appendChild(wrapper);
                }
                zone.onclick = (e) => { e.stopPropagation(); moveOrTarget(conf.id); }; overlay.appendChild(zone);
            });
        }

        function updatePlayer(uid, field, val) { const p = players.find(x => x.uid === uid); if(p) { p[field] = val; renderAll(); save(); } }
        function removePlayer(uid) { if(confirm('確定移除玩家？')) { players = players.filter(x => x.uid !== uid); delete settlementInputs[uid]; if (selectedUid === uid) selectedUid = players[0]?.uid || null; renderAll(); save(); } }
        function resetData() { if(confirm('抹除所有緩存數據？')) { players = []; clearedRooms = new Set(); lockedPoisonFloors = new Set(); localStorage.removeItem(STORAGE_KEY); selectedUid = null; renderAll(); } }
    </script>
</body>
</html>
